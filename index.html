<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nocturne Calendar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121019">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#121019;
    --surface:#1c1926;
    --surface-2:#252131;
    --text:#f1eef8;
    --muted:#8c87a0;
    --accent:#7c6fe8;
    --accent-soft:rgba(124,111,232,.16);
    --ring:#a89ef0;
    --cat-body:#6fd6a8;
    --cat-care:#f2b774;
    --cat-errands:#e8748a;
    --danger:#e8748a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"SF Pro Text",Roboto,"Segoe UI",sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  #app{height:100vh; display:flex; flex-direction:column; position:relative;}

  /* ---- Top bar ---- */
  .topbar{padding:calc(14px + var(--safe-top)) 20px 6px;}
  .eyebrow{font-size:11px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; margin-bottom:2px;}
  .month-row{display:flex; align-items:center; justify-content:space-between;}
  .month-title{font-size:30px; font-weight:700; letter-spacing:-.02em;}
  .month-nav{display:flex; align-items:center; gap:8px;}
  .nav-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:var(--surface);
    color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .today-btn{
    background:var(--surface); color:var(--text); border:none; border-radius:14px;
    padding:8px 14px; font-size:13px; font-weight:600;
  }

  /* ---- Weather ---- */
  .weather{
    margin:12px 20px 4px; background:var(--surface); border-radius:16px; padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--muted);
  }
  .weather .cond{color:var(--text); font-weight:600; font-size:14px;}
  .weather .temp{font-size:22px; font-weight:700; color:var(--text);}
  .weather .loc{font-size:12px;}

  /* ---- Grid ---- */
  .grid-wrap{padding:14px 14px 4px; flex:0 0 auto;}
  .dow-row{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px;}
  .dow{text-align:center; font-size:11px; color:var(--muted); font-weight:600;}
  .day-grid{display:grid; grid-template-columns:repeat(7,1fr); row-gap:4px;}
  .day-cell{
    position:relative; aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; border-radius:14px; font-size:15px; color:var(--text);
  }
  .day-cell.other-month{color:#4a4658;}
  .day-cell.selected{background:var(--accent-soft); outline:1.5px solid var(--ring);}
  .day-cell.today .num{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ring);
  }
  .holiday-tick{position:absolute; top:6px; right:14px; width:4px; height:4px; border-radius:50%; background:var(--accent);}
  .dots{display:flex; gap:3px; margin-top:3px; height:5px;}
  .dot{width:4px; height:4px; border-radius:50%;}

  /* ---- FAB ---- */
  .fab-wrap{position:absolute; right:22px; bottom:calc(96px + var(--safe-bottom)); z-index:30;}
  .fab{
    width:52px; height:52px; border-radius:50%; background:var(--accent); border:none;
    color:white; font-size:26px; font-weight:400; box-shadow:0 8px 20px rgba(124,111,232,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .fab-menu{position:absolute; bottom:64px; right:0; display:flex; flex-direction:column; gap:10px; align-items:flex-end;}
  .fab-item{
    display:flex; align-items:center; gap:10px; background:var(--surface-2); border:none; color:var(--text);
    padding:10px 16px; border-radius:20px; font-size:14px; white-space:nowrap; box-shadow:0 6px 16px rgba(0,0,0,.35);
  }

  /* ---- Bottom sheet ---- */
  .sheet{
    background:var(--surface); border-radius:22px 22px 0 0; flex:1; display:flex; flex-direction:column;
    overflow:hidden; box-shadow:0 -8px 30px rgba(0,0,0,.35); min-height:0;
  }
  .sheet-handle{width:36px; height:4px; background:#3a3648; border-radius:2px; margin:10px auto 4px;}
  .sheet-head{padding:6px 20px 10px; display:flex; align-items:flex-start; justify-content:space-between;}
  .sheet-date{font-size:18px; font-weight:700;}
  .sheet-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .holiday-badge{
    display:inline-block; margin-top:6px; font-size:11px; background:var(--accent-soft); color:var(--ring);
    padding:3px 9px; border-radius:10px; font-weight:600;
  }
  .sheet-list{flex:1; overflow-y:auto; padding:4px 20px calc(20px + var(--safe-bottom));}
  .empty-day{color:var(--muted); font-size:13px; text-align:center; padding:36px 10px;}
  .event-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface-2);
    border-radius:14px; margin-bottom:8px; border-left:3px solid var(--accent);
  }
  .event-time{font-size:12px; color:var(--muted); width:52px; flex:0 0 auto;}
  .event-title{font-size:14.5px; font-weight:600; flex:1;}
  .event-cat{font-size:11px; color:var(--muted); margin-top:2px;}
  .event-del{background:none; border:none; color:var(--muted); font-size:18px; padding:4px 6px;}

  /* ---- Bottom nav ---- */
  .bottom-nav{
    display:flex; justify-content:space-around; align-items:center; padding:8px 0 calc(6px + var(--safe-bottom));
    background:var(--surface); border-top:1px solid rgba(255,255,255,.04);
  }
  .nav-item{display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:10.5px; background:none; border:none;}
  .nav-item.active{color:var(--text);}
  .nav-ic{font-size:18px;}

  /* ---- Modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; z-index:50;
  }
  .modal{
    background:var(--surface); width:100%; border-radius:20px 20px 0 0; padding:18px 20px calc(22px + var(--safe-bottom));
  }
  .modal h3{margin:0 0 14px; font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid #322e42; color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:14.5px;
  }
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .cat-picker{display:flex; gap:8px;}
  .cat-opt{
    flex:1; padding:9px 0; border-radius:10px; text-align:center; font-size:12.5px; font-weight:600;
    border:1.5px solid transparent; background:var(--surface-2); color:var(--muted);
  }
  .cat-opt.sel{border-color:currentColor;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{flex:1; border:none; border-radius:12px; padding:12px; font-size:14.5px; font-weight:600;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:var(--surface-2); color:var(--text);}
  .quick-hint{font-size:11.5px; color:var(--muted); margin:-4px 0 12px;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="eyebrow" id="year-label">2026</div>
    <div class="month-row">
      <div class="month-title" id="month-label">Agosto</div>
      <div class="month-nav">
        <button class="nav-btn" id="prev-btn">‹</button>
        <button class="today-btn" id="today-btn">Hoy</button>
        <button class="nav-btn" id="next-btn">›</button>
      </div>
    </div>
  </div>

  <div class="weather" id="weather-box">
    <div>
      <div class="cond" id="w-cond">Cargando clima…</div>
      <div class="loc">Ciudad de Panamá</div>
    </div>
    <div class="temp" id="w-temp">--°</div>
  </div>

  <div class="grid-wrap">
    <div class="dow-row" id="dow-row"></div>
    <div class="day-grid" id="day-grid"></div>
  </div>

  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <div class="sheet-date" id="sheet-date">Lunes 24 Ago</div>
        <div class="sheet-sub" id="sheet-sub">Sin eventos</div>
        <div id="holiday-badge-wrap"></div>
      </div>
    </div>
    <div class="sheet-list" id="sheet-list"></div>
  </div>

  <div class="fab-wrap">
    <div class="fab-menu" id="fab-menu" style="display:none;">
      <button class="fab-item" id="fab-quick">⚡ Agregar rápido</button>
      <button class="fab-item" id="fab-new">＋ Nuevo evento</button>
    </div>
    <button class="fab" id="fab-btn">+</button>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-tab="month"><span class="nav-ic">▦</span>Mes</button>
    <button class="nav-item" data-tab="year"><span class="nav-ic">▤</span>Año</button>
    <button class="nav-item" data-tab="search"><span class="nav-ic">⌕</span>Buscar</button>
    <button class="nav-item" data-tab="you"><span class="nav-ic">◔</span>Tú</button>
  </div>
</div>

<script>
/* ---------------- State ---------------- */
const STORAGE_KEY = 'nocturne_events_v1';
let events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
function saveEvents(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); }

const CATS = {
  body:     {label:'Cuerpo',   color:'var(--cat-body)'},
  care:     {label:'Cuidado',  color:'var(--cat-care)'},
  errands:  {label:'Diligencias', color:'var(--cat-errands)'},
};

const DOW = ['L','M','X','J','V','S','D'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let today = new Date(); today.setHours(0,0,0,0);
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();
let selected = new Date(today);

function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function sameDay(a,b){ return fmt(a)===fmt(b); }

/* ---------------- Panama holidays ---------------- */
function easterDate(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }

function holidaysFor(year){
  const easter = easterDate(year);
  const list = [
    {date:new Date(year,0,1), name:"Año Nuevo"},
    {date:new Date(year,0,9), name:"Día de los Mártires"},
    {date:addDays(easter,-49), name:"Lunes de Carnaval"},
    {date:addDays(easter,-48), name:"Martes de Carnaval"},
    {date:addDays(easter,-2), name:"Viernes Santo"},
    {date:new Date(year,4,1), name:"Día del Trabajo"},
    {date:new Date(year,10,3), name:"Separación de Colombia"},
    {date:new Date(year,10,4), name:"Día de la Bandera"},
    {date:new Date(year,10,5), name:"Día de Colón"},
    {date:new Date(year,10,10), name:"Primer Grito de Independencia", regional:true},
    {date:new Date(year,10,28), name:"Independencia de España"},
    {date:new Date(year,11,8), name:"Día de las Madres"},
    {date:new Date(year,11,25), name:"Navidad"},
  ];
  const map = {};
  list.forEach(h=>{ map[fmt(h.date)] = h; });
  return map;
}
let holidayCache = {};
function getHolidays(year){
  if(!holidayCache[year]) holidayCache[year] = holidaysFor(year);
  return holidayCache[year];
}

/* ---------------- Weather (Open-Meteo, no key needed) ---------------- */
async function loadWeather(){
  try{
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=8.9824&longitude=-79.5199&current=temperature_2m,weather_code&timezone=America%2FPanama');
    const data = await res.json();
    const t = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    document.getElementById('w-temp').textContent = t+'°';
    document.getElementById('w-cond').textContent = weatherLabel(code);
  }catch(e){
    document.getElementById('w-cond').textContent = 'Clima no disponible';
    document.getElementById('w-temp').textContent = '';
  }
}
function weatherLabel(code){
  if(code===0) return 'Despejado';
  if([1,2,3].includes(code)) return 'Parcialmente nublado';
  if([45,48].includes(code)) return 'Neblina';
  if([51,53,55,61,63,65,80,81,82].includes(code)) return 'Lluvia';
  if([95,96,99].includes(code)) return 'Tormentas';
  return 'Variable';
}

/* ---------------- Rendering ---------------- */
function renderDow(){
  const row = document.getElementById('dow-row');
  row.innerHTML = DOW.map(d=>`<div class="dow">${d}</div>`).join('');
}

function renderGrid(){
  document.getElementById('year-label').textContent = viewYear;
  document.getElementById('month-label').textContent = MONTHS[viewMonth];

  const first = new Date(viewYear, viewMonth, 1);
  let startOffset = (first.getDay()+6)%7; // Monday=0
  const gridStart = addDays(first, -startOffset);
  const holidays = getHolidays(viewYear);

  const grid = document.getElementById('day-grid');
  grid.innerHTML = '';
  for(let i=0;i<42;i++){
    const d = addDays(gridStart, i);
    if(i>=35 && d.getMonth()!==viewMonth) break; // trim trailing row if not needed
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if(d.getMonth()!==viewMonth) cell.classList.add('other-month');
    if(sameDay(d, today)) cell.classList.add('today');
    if(sameDay(d, selected)) cell.classList.add('selected');

    const key = fmt(d);
    const dayEvents = events.filter(e=>e.date===key);
    const hol = holidays[key];

    cell.innerHTML = `
      <div class="num">${d.getDate()}</div>
      ${hol ? '<div class="holiday-tick"></div>' : ''}
      <div class="dots">${dayEvents.slice(0,3).map(e=>`<div class="dot" style="background:${CATS[e.cat]?.color||'var(--accent)'}"></div>`).join('')}</div>
    `;
    cell.addEventListener('click', ()=>{ selected = d; renderGrid(); renderSheet(); });
    grid.appendChild(cell);
  }
}

function renderSheet(){
  const key = fmt(selected);
  const dayEvents = events.filter(e=>e.date===key).sort((a,b)=>a.start.localeCompare(b.start));
  const holidays = getHolidays(selected.getFullYear());
  const hol = holidays[key];

  const dayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  document.getElementById('sheet-date').textContent = `${dayNames[selected.getDay()]} ${selected.getDate()} ${MONTHS[selected.getMonth()].slice(0,3)}`;
  document.getElementById('sheet-sub').textContent = dayEvents.length
    ? `${dayEvents.length} evento${dayEvents.length>1?'s':''} · ${dayEvents[0].start} primero`
    : 'Sin eventos';

  document.getElementById('holiday-badge-wrap').innerHTML = hol
    ? `<div class="holiday-badge">${hol.name}${hol.regional?' · regional':''}</div>` : '';

  const list = document.getElementById('sheet-list');
  if(dayEvents.length===0){
    list.innerHTML = `<div class="empty-day">Nada por aquí todavía.<br>Toca “+” para agregar algo.</div>`;
    return;
  }
  list.innerHTML = dayEvents.map(e=>`
    <div class="event-row" style="border-left-color:${CATS[e.cat]?.color||'var(--accent)'}">
      <div class="event-time">${e.start}${e.end?('–'+e.end):''}</div>
      <div style="flex:1">
        <div class="event-title">${escapeHtml(e.title)}</div>
        <div class="event-cat">${CATS[e.cat]?.label||''}</div>
      </div>
      <button class="event-del" data-id="${e.id}">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('.event-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      events = events.filter(e=>e.id!==btn.dataset.id);
      saveEvents(); renderGrid(); renderSheet();
    });
  });
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ---------------- Navigation ---------------- */
document.getElementById('prev-btn').addEventListener('click', ()=>{
  viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} renderGrid();
});
document.getElementById('next-btn').addEventListener('click', ()=>{
  viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} renderGrid();
});
document.getElementById('today-btn').addEventListener('click', ()=>{
  viewYear = today.getFullYear(); viewMonth = today.getMonth(); selected = new Date(today);
  renderGrid(); renderSheet();
});

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(btn.dataset.tab!=='month'){
      alert('Esta sección es parte del diseño original pero aún no está implementada en esta primera versión.');
      document.querySelectorAll('.nav-item')[0].classList.add('active');
      btn.classList.remove('active');
    }
  });
});

/* ---------------- FAB & Modal ---------------- */
const fabBtn = document.getElementById('fab-btn');
const fabMenu = document.getElementById('fab-menu');
let fabOpen = false;
fabBtn.addEventListener('click', ()=>{
  fabOpen = !fabOpen;
  fabMenu.style.display = fabOpen ? 'flex' : 'none';
  fabBtn.textContent = fabOpen ? '×' : '+';
});
function closeFab(){ fabOpen=false; fabMenu.style.display='none'; fabBtn.textContent='+'; }

document.getElementById('fab-new').addEventListener('click', ()=>{ closeFab(); openEventModal(); });
document.getElementById('fab-quick').addEventListener('click', ()=>{ closeFab(); openQuickAdd(); });

function openModalShell(innerHtml){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">${innerHtml}</div>`;
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  document.body.appendChild(backdrop);
  return backdrop;
}

function openEventModal(){
  const key = fmt(selected);
  const backdrop = openModalShell(`
    <h3>Nuevo evento</h3>
    <div class="field"><label>Título</label><input id="ev-title" placeholder="Ej. Correr en Cinta Costera"></div>
    <div class="field"><label>Fecha</label><input id="ev-date" type="date" value="${key}"></div>
    <div class="field-row">
      <div class="field"><label>Inicio</label><input id="ev-start" type="time" value="09:00"></div>
      <div class="field"><label>Fin</label><input id="ev-end" type="time" value="10:00"></div>
    </div>
    <div class="field">
      <label>Categoría</label>
      <div class="cat-picker" id="cat-picker">
        ${Object.entries(CATS).map(([k,v])=>`<div class="cat-opt" data-cat="${k}" style="color:${v.color}">${v.label}</div>`).join('')}
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="save-btn">Guardar</button>
    </div>
  `);
  let chosenCat = 'body';
  const picker = backdrop.querySelector('#cat-picker');
  picker.children[0].classList.add('sel');
  picker.querySelectorAll('.cat-opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      picker.querySelectorAll('.cat-opt').forEach(o=>o.classList.remove('sel'));
      el.classList.add('sel'); chosenCat = el.dataset.cat;
    });
  });
  backdrop.querySelector('#cancel-btn').addEventListener('click', ()=>backdrop.remove());
  backdrop.querySelector('#save-btn').addEventListener('click', ()=>{
    const title = backdrop.querySelector('#ev-title').value.trim();
    if(!title) return;
    events.push({
      id: crypto.randomUUID(),
      title,
      date: backdrop.querySelector('#ev-date').value,
      start: backdrop.querySelector('#ev-start').value,
      end: backdrop.querySelector('#ev-end').value,
      cat: chosenCat,
    });
    saveEvents(); backdrop.remove(); renderGrid(); renderSheet();
  });
}

function openQuickAdd(){
  const backdrop = openModalShell(`
    <h3>Agregar rápido</h3>
    <div class="quick-hint">Escribe algo como "Yoga 6pm" y lo agrego hoy a esa hora.</div>
    <div class="field"><input id="quick-text" placeholder="Yoga 6pm" autofocus></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="q-cancel">Cancelar</button>
      <button class="btn btn-primary" id="q-save">Agregar</button>
    </div>
  `);
  backdrop.querySelector('#q-cancel').addEventListener('click', ()=>backdrop.remove());
  backdrop.querySelector('#q-save').addEventListener('click', ()=>{
    const raw = backdrop.querySelector('#quick-text').value.trim();
    if(!raw) return;
    const parsed = parseQuickAdd(raw);
    events.push({
      id: crypto.randomUUID(),
      title: parsed.title,
      date: fmt(selected),
      start: parsed.start,
      end: parsed.end,
      cat: 'body',
    });
    saveEvents(); backdrop.remove(); renderGrid(); renderSheet();
  });
}

function parseQuickAdd(text){
  const m = text.match(/^(.*?)(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*$/i);
  if(!m) return {title:text, start:'09:00', end:'10:00'};
  let [, title, hh, mm, ampm] = m;
  title = title.trim() || text;
  let h = parseInt(hh,10);
  const min = mm ? mm : '00';
  if(ampm){
    ampm = ampm.toLowerCase();
    if(ampm==='pm' && h<12) h+=12;
    if(ampm==='am' && h===12) h=0;
  }
  const start = String(h).padStart(2,'0')+':'+min;
  const endH = (h+1)%24;
  const end = String(endH).padStart(2,'0')+':'+min;
  return {title, start, end};
}

/* ---------------- Init ---------------- */
renderDow();
renderGrid();
renderSheet();
loadWeather();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
